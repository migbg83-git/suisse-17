<section class="framework-continuity" id="continuidad">
  <div class="container-listing">
    <h2>Continuidad</h2>

    <div class="framework-cta-list">
      @for (cta of ctas; track cta.id) {
        <article class="framework-cta-item">
          <h3>{{ cta.label }}</h3>
          @if (cta.description) {
            <p>{{ cta.description }}</p>
          }

          @if (cta.disabled) {
            <button type="button" disabled>{{ cta.linkLabel || cta.label }}</button>
          } @else if (cta.route) {
            <a [routerLink]="[cta.route]">{{ cta.linkLabel || cta.label }}</a>
          }
        </article>
      }
    </div>
  </div>
</section>
